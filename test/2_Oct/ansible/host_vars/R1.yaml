ospf_config:
  processes:
    - process_id: 1
      router_id: 1.1.1.1
      network:
        - address: 192.168.84.0
          area: 0
          wildcard_bits: 0.0.0.255
        - address: 192.168.90.0
          area: 0
          wildcard_bits: 0.0.0.255

ospf_interface_config:
  - name: GigabitEthernet2
    address_family:
      - afi: "ipv4"
        process:
          area_id: 0
          id: 1
        shutdown: False
  - name: GigabitEthernet3
    address_family:
      - afi: "ipv4"
        process:
          area_id: 0
          id: 1
        shutdown: False