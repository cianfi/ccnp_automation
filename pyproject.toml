[project]
name = "ccnp-automation"
version = "0.1.0"
description = ""
authors = [
    {name = "Cian"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "openai (>=3.37.0,<4.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "fastmcp (>=4.1.4,<5.0.0) ; python_version >= \"3.11\" and python_version < \"4.0\"",
    "genie (>=26.9,<27.0) ; python_version >= \"3.11\" and python_version < \"4.0\"",
    "pyats (>=26.9,<27.0) ; python_version >= \"3.11\" and python_version < \"4.0\"",
]

[dependency-groups]
dev = [
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false